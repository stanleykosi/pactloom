[package]
name = "wholepact-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
offline-admission-export = ["dep:wholepact-authority"]

[dependencies]
wholepact-authority = { path = "../wholepact-authority", optional = true, default-features = false }
wholepact-storage-security = { path = "../wholepact-storage-security" }
wholepact-core = { path = "../wholepact-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "x25519", "chacha"] }
rand = { version = "=0.10.0", default-features = false, features = ["std_rng"] }
getrandom = "=0.4.3"
zeroize = "=1.9.1"
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = "=0.11.0"
rusqlite.workspace = true
