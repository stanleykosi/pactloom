[package]
name = "wholepact-signer-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone Wholepact native Wayland signer review window"

[features]
default = ["authority-signing"]
authority-signing = ["wholepact-signer/authority-signing"]
synthetic-qualification = ["wholepact-signer/synthetic-qualification"]

[dependencies]
wholepact-signer = { path = "../wholepact-signer", features = ["native-ui"] }
