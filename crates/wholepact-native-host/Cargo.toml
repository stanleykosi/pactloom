[package]
name = "wholepact-native-host"
default-run = "wholepact-native-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Explicit foreground non-signing protected Wholepact host"

[features]
default = []
# Explicit new-profile opt-in; default/legacy V3 activation is unchanged.
durable-proposal = ["manual-admission", "wholepact-engine/durable-proposal", "wholepact-signer/durable-proposal"]
manual-admission = ["wholepact-signer/manual-inventory-client", "wholepact-authority/pending-birth-foundation", "financial-runtime", "wholepact-engine/manual-admission", "dep:wholepact-signer-origin", "dep:hpke", "dep:rand", "dep:base64", "dep:chrono", "dep:rusqlite", "dep:pczt", "wholepact-transport/offline-admission-export"]
synthetic-born-joined-qualification = ["manual-admission", "wholepact-signer/synthetic-born-joined-qualification", "wholepact-wallet/synthetic-qualification"]
financial-runtime = ["wholepact-engine/wallet-sync", "wholepact-engine/submission-handoff", "wholepact-engine/signer-authority-bridge", "wholepact-engine/candidate-construction", "wholepact-service/signer-release", "wholepact-service/proposal-review", "dep:wholepact-signer", "dep:wholepact-signer-release", "dep:wholepact-authority", "dep:wholepact-protocol", "dep:wholepact-wallet", "dep:wholepact-proof-jobs", "dep:rustls-pki-types"]

[dependencies]
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "x25519", "chacha"], optional = true }
rand = { version = "=0.10.0", default-features = false, features = ["std_rng"], optional = true }
base64 = { version = "=0.22.1", optional = true }
chrono = { version = "=0.4.45", default-features = false, features = ["std"], optional = true }
rusqlite = { workspace = true, optional = true }
pczt = { version = "=0.10.0-pre.1", default-features = false, features = ["std", "orchard", "signer"], optional = true }
wholepact-signer-release = { path = "../wholepact-signer-release", optional = true }
rustls-pki-types = { version = "=1.15.1", optional = true }
wholepact-wallet = { path = "../wholepact-wallet", optional = true, features = ["encrypted-storage"] }
wholepact-proof-jobs = { path = "../wholepact-proof-jobs", optional = true }
wholepact-protocol = { path = "../wholepact-protocol", optional = true, features = ["submission-handoff"] }
wholepact-signer = { path = "../wholepact-signer", optional = true, default-features = false }
wholepact-authority = { path = "../wholepact-authority", optional = true }
wholepact-core = { path = "../wholepact-core" }
wholepact-engine = { path = "../wholepact-engine", features = ["transport-workflows"] }
wholepact-store = { path = "../wholepact-store" }
wholepact-storage-security = { path = "../wholepact-storage-security" }
wholepact-transport = { path = "../wholepact-transport" }
wholepact-chain = { path = "../wholepact-chain", features = ["submission-dispatch"] }
wholepact-service = { path = "../wholepact-service", features = ["protected-transport", "operator-chain"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
argon2 = { version = "=0.5.3", features = ["zeroize"] }
chacha20poly1305 = "=0.11.0"
zeroize = { version = "=1.9.1", features = ["derive"] }
getrandom = "=0.4.3"
libc = "0.2"
rpassword = "=7.5.4"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
time = { version = "0.3", features = ["formatting", "parsing"] }

[dev-dependencies]
orchard = { version = "=0.16.0", default-features = false, features = ["std"] }
zcash_primitives = { version = "=0.31.0-pre.1", default-features = false, features = ["std"] }
zcash_protocol = { version = "=0.11.0-pre.0" }
tempfile = "3"
prost = "=0.14.4"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "linux")'.dependencies]
wholepact-signer-origin = { path = "../wholepact-signer-origin", optional = true }
