[package]
name = "wholepact-wallet"
version.workspace = true
edition = "2024"
rust-version = "1.88"
license.workspace = true
description = "Testnet-only maintained-library wallet contribution adapter"

[features]
default = []
protected-sync = ["dep:wholepact-signer-origin", "sync", "encrypted-storage", "dep:wholepact-chain", "dep:hex", "dep:wholepact-core", "dep:serde_json", "dep:sha2", "dep:zeroize"]
synthetic-qualification = ["wallet", "orchard/zeroize"]
encrypted-storage = ["wallet", "dep:wholepact-storage-security"]
wallet = ["dep:zcash_client_backend", "dep:zcash_client_sqlite", "dep:zcash_keys", "dep:zcash_protocol", "dep:zcash_primitives", "dep:orchard", "dep:shardtree", "dep:incrementalmerkletree", "dep:rusqlite", "dep:rand", "dep:zip32", "dep:zcash_address", "dep:wholepact-protocol"]
sync = ["wallet", "zcash_client_backend/lightwalletd-tonic-transport", "dep:tonic", "dep:tokio"]

[dependencies]
wholepact-signer-origin = { path = "../wholepact-signer-origin", optional = true }
wholepact-core = { path = "../wholepact-core", optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
zeroize = { version = "=1.9.1", optional = true }
wholepact-chain = { path = "../wholepact-chain", optional = true }
hex = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
zcash_client_backend = { version = "=0.25.0-pre.1", optional = true, default-features = false, features = ["orchard"] }
zcash_client_sqlite = { version = "=0.23.0-pre.1", optional = true, default-features = false, features = ["orchard"] }
zcash_keys = { version = "=0.17.0-pre.1", optional = true, default-features = false, features = ["std", "orchard"] }
zcash_protocol = { version = "=0.11.0-pre.0", optional = true }
zcash_primitives = { version = "=0.31.0-pre.1", optional = true, default-features = false, features = ["std"] }
orchard = { version = "=0.16.0", optional = true, default-features = false, features = ["std"] }
shardtree = { version = "=0.8.0", optional = true }
incrementalmerkletree = { version = "=0.9.0", optional = true }
rusqlite = { workspace = true, optional = true }
rand = { version = "=0.10.0", optional = true, features = ["std_rng", "sys_rng"] }
zip32 = { version = "=0.2.1", optional = true }
tonic = { version = "=0.14.6", optional = true, default-features = false, features = ["transport"] }
tokio = { version = "1", optional = true, features = ["time", "macros", "rt"] }
zcash_address = { version = "=0.14.0-pre.1", optional = true }

wholepact-protocol = { path = "../wholepact-protocol", optional = true, features = ["construction"] }


wholepact-storage-security = { path = "../wholepact-storage-security", optional = true }

[dev-dependencies]
wholepact-core = { path = "../wholepact-core" }
wholepact-engine = { path = "../wholepact-engine", features = ["wallet-sync", "local-proof-jobs"] }
wholepact-store = { path = "../wholepact-store" }
wholepact-chain = { path = "../wholepact-chain", features = ["synthetic-qualification"] }
prost = "=0.14.4"
axum = { version = "0.8", features = ["http2"] }
serde_json.workspace = true
tempfile = "3"

wholepact-proof-jobs = { path = "../wholepact-proof-jobs" }
wholepact-signer = { path = "../wholepact-signer", features = ["checkpoint-review", "native-ui", "synthetic-qualification"] }
