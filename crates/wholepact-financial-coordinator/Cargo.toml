[package]
name = "wholepact-financial-coordinator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fixed-fork coordinator with inert bootstrap and opt-in source-backed cancel-only or one-exact-append Witness review"

[features]
default = []
common-image-bootstrap = []
cancel-only-witness-review = ["common-image-bootstrap", "wholepact-financial-coordinator-origin/cancel-only-witness-review", "dep:wholepact-authority", "wholepact-authority/coordinated-witness-cancel-review", "dep:eframe", "dep:winit", "dep:zeroize"]

coordinated-witness-delivery-append = ["common-image-bootstrap", "wholepact-financial-coordinator-origin/coordinated-witness-delivery-append", "dep:wholepact-authority", "wholepact-authority/coordinated-witness-delivery-append", "dep:eframe", "dep:winit", "dep:zeroize"]

# Source-only private input leaf, with no runtime callsite. Pinned egui-winit can
# log logical keys and malformed IME text, so this profile statically disables
# the log facade in debug AND release builds. Typed product diagnostics remain.
coordinator-transient-password-input = ["common-image-bootstrap", "dep:eframe", "dep:zeroize", "dep:log", "log/max_level_off"]

# Concrete C source-entry/initial-Read App composition, still without a
# bootstrap/binary callsite. The password feature is a mandatory log-off edge.
coordinated-financial-source-ui = ["coordinator-transient-password-input", "wholepact-financial-coordinator-origin/coordinated-financial-workflow-v1", "dep:winit", "dep:serde_json"]

# Explicit integration-only runtime entry. This selects genuine fixed-fork
# consumers; it is not a claim that all later workflow stages are qualified.
coordinated-financial-runtime = ["coordinated-financial-source-ui", "dep:wholepact-native-host", "wholepact-native-host/coordinated-financial-workflow-v1", "dep:wholepact-signer", "wholepact-signer/coordinated-financial-workflow-v1", "dep:wholepact-authority", "wholepact-authority/coordinated-witness-financial-history", "wholepact-authority/coordinated-witness-financial-continuation", "wholepact-authority/coordinated-witness-financial-signing", "wholepact-authority/coordinated-witness-completed-pair"]

[[bin]]
name = "wholepact-financial-coordinator"
path = "src/main.rs"
required-features = ["common-image-bootstrap"]

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
wholepact-native-host = { path = "../wholepact-native-host", optional = true, default-features = false }
wholepact-signer = { path = "../wholepact-signer", optional = true, default-features = false }
serde_json = { workspace = true, optional = true }
wholepact-financial-coordinator-origin = { path = "../wholepact-financial-coordinator-origin" }
wholepact-authority = { path = "../wholepact-authority", optional = true, default-features = false }
eframe = { version = "=0.36.2", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland"] }
winit = { version = "=0.30.13", optional = true, default-features = false, features = ["wayland", "rwh_06"] }
zeroize = { version = "=1.9.1", optional = true }
log = { version = "=0.4.34", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(wholepact_bootstrap_ci)', 'cfg(wholepact_delivery_ci)'] }
