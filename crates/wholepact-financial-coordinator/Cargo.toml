[package]
name = "wholepact-financial-coordinator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fixed-fork coordinator with inert bootstrap and opt-in source-backed cancel-only Witness review"

[features]
default = []
common-image-bootstrap = []
cancel-only-witness-review = ["common-image-bootstrap", "wholepact-financial-coordinator-origin/cancel-only-witness-review", "dep:wholepact-authority", "dep:eframe", "dep:winit", "dep:zeroize"]

[[bin]]
name = "wholepact-financial-coordinator"
path = "src/main.rs"
required-features = ["common-image-bootstrap"]

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
wholepact-financial-coordinator-origin = { path = "../wholepact-financial-coordinator-origin" }
wholepact-authority = { path = "../wholepact-authority", optional = true, default-features = false, features = ["coordinated-witness-cancel-review"] }
eframe = { version = "=0.36.2", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland"] }
winit = { version = "=0.30.13", optional = true, default-features = false, features = ["wayland", "rwh_06"] }
zeroize = { version = "=1.9.1", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(wholepact_bootstrap_ci)'] }
