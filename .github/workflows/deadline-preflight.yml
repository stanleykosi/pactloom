name: Authenticated terminal phase preflight only
on:
  push:
    branches: [checkpoint/terminal-phase-preflight-p80]
permissions: {}
concurrency:
  group: terminal-phase-preflight-p80
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'stanleykosi/pactloom' && github.ref == 'refs/heads/checkpoint/terminal-phase-preflight-p80' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact public event source without credentials
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          umask 022
          public_git() {
            env -i PATH="$PATH" HOME="$RUNNER_TEMP/preflight-home" \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
              git -c credential.helper= -c http.extraheader= "$@"
          }
          public_git init source
          public_git -C source fetch --no-tags --depth=1 https://github.com/stanleykosi/pactloom.git "$SOURCE_COMMIT"
          public_git -C source checkout --detach FETCH_HEAD
          test "$(public_git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(public_git -C source status --porcelain --untracked-files=all)"
      - name: Exact historical P40 adapter test fixture and Python preflight
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/preflight-home" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 git -c credential.helper= -c http.extraheader= init H
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/preflight-home" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 git -c credential.helper= -c http.extraheader= -C H fetch --no-tags --depth=1 https://github.com/stanleykosi/pactloom.git 99501f5853a4516fc94a6361f39cb4373048f01f
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/preflight-home" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 git -c credential.helper= -c http.extraheader= -C H checkout --detach FETCH_HEAD
          test "$(env -i PATH="$PATH" HOME="$RUNNER_TEMP/preflight-home" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 git -c credential.helper= -c http.extraheader= -C H rev-parse HEAD)" = 99501f5853a4516fc94a6361f39cb4373048f01f
          echo '2b251c9f0bcce7a227d7e7f37f2a7a51c049f6b0e30e36ee3c11adce19c6dce0  H/scripts/ci-financial-supervisor.py' | sha256sum --check --status
          cd source
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/preflight-home" python3 -I -B -m unittest discover -s scripts/tests -p 'test*financial*.py'
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/preflight-home" python3 -I -B scripts/ci-financial-launch-tests.py
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/preflight-home" python3 -I -B -m unittest discover -s scripts/financial-runtime-reuse -p 'test_*.py'
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/preflight-home" python3 -I -B scripts/ci-financial-handoff-source-audit.py --source "$PWD"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/preflight-home" python3 -I -B scripts/ci-financial-admit-read-source-audit.py --source "$PWD"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/preflight-home" python3 -I -B scripts/ci-financial-intent-detail-source-audit.py --source "$PWD"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/preflight-home" python3 -I -B scripts/ci-financial-downstream-projection-audit.py --source "$PWD"
      - name: Pinned compiler, API fences and focused deadline regressions
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deadline-preflight/home" "$RUNNER_TEMP/deadline-preflight/cargo"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/deadline-preflight/home" \
            RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
            CARGO_HOME="$RUNNER_TEMP/deadline-preflight/cargo" \
            PREFLIGHT_ROOT="$RUNNER_TEMP/deadline-preflight" \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
            CARGO_BUILD_JOBS=3 CARGO_INCREMENTAL=0 \
            python3 -I -B - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['PREFLIGHT_ROOT'])
          repo = pathlib.Path.cwd()
          def run(args, *, env=None, timeout=450):
              p = subprocess.run(args, env=env, text=True, stdout=subprocess.PIPE,
                                 stderr=subprocess.PIPE, timeout=timeout)
              if p.returncode:
                  print(p.stdout[-12000:]); print(p.stderr[-12000:])
                  raise SystemExit('preflight command failed: ' + args[0])
              return p.stdout
          # No rust-toolchain.toml exists at the reviewed base; match its existing CI recipe.
          recipe = (repo/'scripts/ci-financial-artifacts.py').read_text()
          assert "toolchain='1.99.0', rustc='rustc 1.99.0 (b940084d7 2026-09-28)'" in recipe
          rustup = ['rustup', 'run', '1.99.0']
          installed = run(['rustup', 'toolchain', 'list'], timeout=30)
          if not any(line.split()[0] == '1.99.0-x86_64-unknown-linux-gnu' for line in installed.splitlines() if line.split()):
              run(['rustup', 'toolchain', 'install', '1.99.0', '--profile', 'minimal', '--no-self-update'], timeout=600)
          assert run(rustup+['rustc', '--version'], timeout=30).strip() == 'rustc 1.99.0 (b940084d7 2026-09-28)'
          assert 'host: x86_64-unknown-linux-gnu' in run(rustup+['rustc', '-Vv'], timeout=30)
          env = dict(os.environ)
          env['WHOLEPACT_FINANCIAL_BUILD_MODE'] = 'production'
          print(run(rustup+['python3', '-I', '-B', 'scripts/ci-financial-cause-trace.py'], env=env, timeout=180))
          print(run(rustup+['python3', '-I', '-B', 'scripts/tests/test_initial_history_failure_boundaries.py'], env=env, timeout=180))
          print(run(rustup+['python3', '-I', '-B', 'scripts/tests/test_v3_deadline_identity.py'], env=env, timeout=180))
          print(run(rustup+['python3', '-I', '-B', 'scripts/ci-financial-close-trace.py', '--source', str(repo), '--out', str(root/'close-traces'), '--run'], env=env, timeout=180))
          print(run(rustup+['python3', '-I', '-B', 'scripts/ci-financial-preparation-client-trace.py', '--source', str(repo), '--out', str(root/'readiness-client-traces'), '--run'], env=env, timeout=180))
          print(run(rustup+['python3', '-I', '-B', 'scripts/ci-financial-preparation-server-trace.py', '--source', str(repo), '--out', str(root/'readiness-server-traces'), '--run'], env=env, timeout=180))
          print(run(rustup+['python3', '-I', '-B', 'scripts/ci-financial-readiness-frame-trace.py', '--source', str(repo), '--out', str(root/'readiness-frame-traces'), '--run'], env=env, timeout=180))
          print(run(rustup+['python3', '-I', '-B', 'scripts/ci-financial-postimport-frame-trace.py', '--source', str(repo), '--out', str(root/'postimport-frame-traces'), '--run'], env=env, timeout=180))
          print(run(rustup+['python3', '-I', '-B', 'scripts/ci-financial-service-lifetime-trace.py', '--source', str(repo), '--out', str(root/'service-lifetime-traces'), '--run'], env=env, timeout=180))
          print(run(rustup+['python3', '-I', '-B', 'scripts/ci-financial-admit-read-trace.py', '--source', str(repo), '--out', str(root/'admit-read-traces'), '--run'], env=env, timeout=180))
          print(run(rustup+['python3', '-I', '-B', 'scripts/ci-financial-transport-identity-trace.py', '--source', str(repo), '--out', str(root/'transport-identity-traces'), '--run'], env=env, timeout=180))
          print(run(rustup+['python3', '-I', '-B', 'scripts/ci-financial-ready-deadline-trace.py', '--source', str(repo), '--out', str(root/'ready-deadline-traces'), '--run'], env=env, timeout=180))
          print(run(rustup+['python3', '-I', '-B', 'scripts/ci-financial-pair-channel-trace.py', '--source', str(repo), '--out', str(root/'pair-channel-traces'), '--run'], env=env, timeout=180))
          print(run(rustup+['python3', '-I', '-B', 'scripts/ci-financial-host-phase-trace.py', '--source', str(repo), '--out', str(root/'host-phase-traces'), '--run'], env=env, timeout=180))
          print(run(rustup+['python3', '-I', '-B', 'scripts/ci-financial-admission-trace.py', '--source', str(repo), '--out', str(root/'admission-traces'), '--run'], env=env, timeout=180))
          print(run(rustup+['python3', '-I', '-B', 'scripts/ci-financial-admission-response-trace.py', '--source', str(repo), '--out', str(root/'admission-response-traces'), '--run'], env=env, timeout=180))
          print(run(rustup+['python3', '-I', '-B', 'scripts/ci-financial-admission-client-trace.py', '--source', str(repo), '--out', str(root/'admission-client-traces'), '--run'], env=env, timeout=180))
          package = 'wholepact-financial-coordinator-origin'
          feature = 'coordinated-financial-workflow-v1'
          environments = {}
          for profile in ['minimal', 'production', 'observed-pixel', 'observed-semantic']:
              env = dict(os.environ)
              env['WHOLEPACT_FINANCIAL_BUILD_MODE'] = 'production' if profile == 'minimal' else profile
              target = root/'target-shared'
              env['CARGO_TARGET_DIR'] = str(target)
              environments[profile] = env
              args = rustup+['cargo', 'check', '--locked', '-p', package, '--lib', '--no-default-features', '--message-format=json']
              if profile != 'minimal': args += ['--features', feature]
              rows = [json.loads(line) for line in run(args, env=env).splitlines() if line.startswith('{')]
              scripts = [row for row in rows if row.get('reason') == 'compiler-artifact' and row.get('target', {}).get('kind') == ['custom-build'] and row.get('manifest_path') == str(repo/'crates'/package/'Cargo.toml')]
              assert len(scripts) == 1 and scripts[0]['target']['src_path'] == str(repo/'crates'/package/'build.rs'), profile
              package_id = scripts[0]['package_id']
              cfg_rows = [row for row in rows if row.get('reason') == 'build-script-executed' and row.get('package_id') == package_id]
              expected_cfg = [] if profile in ['minimal','production'] else ['wholepact_financial_ci','wholepact_financial_external_ci'] + (['wholepact_financial_rendered_host_semantic_ci'] if profile == 'observed-semantic' else [])
              assert len(cfg_rows) == 1 and cfg_rows[0]['cfgs'] == expected_cfg, profile
              assert cfg_rows[0]['linked_libs'] == [] and cfg_rows[0]['linked_paths'] == [] and cfg_rows[0]['env'] == [], profile
              for row in rows:
                  if row.get('reason') == 'build-script-executed' and row.get('package_id') != package_id:
                      assert not any(cfg.startswith('wholepact_financial_') for cfg in row.get('cfgs', [])), profile
              meta = [pathlib.Path(f) for row in rows if row.get('reason') == 'compiler-artifact' and row.get('target', {}).get('name') == 'wholepact_financial_coordinator_origin' for f in row.get('filenames', []) if f.endswith('.rmeta')]
              assert len(meta) == 1 and meta[0].is_file(), profile
              def probe(symbol, expected):
                  src = root/('probe-'+profile+'-'+symbol+'.rs')
                  src.write_text('pub use wholepact_financial_coordinator_origin::'+symbol+';\n')
                  command = rustup+['rustc', '--crate-name', 'api_probe', '--crate-type=lib', '--edition=2021', '--emit=metadata', '--error-format=json', str(src), '--extern', 'wholepact_financial_coordinator_origin='+str(meta[0]), '-L', 'dependency='+str(target/'debug/deps'), '-o', str(root/'api-probe.rmeta')]
                  p = subprocess.run(command, env=env, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=30)
                  errors = [json.loads(line) for line in p.stderr.splitlines() if line.startswith('{')]
                  errors = [e for e in errors if e.get('level') == 'error' and e.get('code')]
                  if expected:
                      assert p.returncode == 0, (profile, symbol, p.stderr)
                  else:
                      assert p.returncode != 0 and len(errors) == 1, (profile, symbol, p.stderr)
                      assert errors[0]['code']['code'] == 'E0432' and symbol in errors[0]['message'], (profile, symbol, p.stderr)
              probe('bootstrap_common_image_v1', True)
              probe('SignerV3EnrollmentFinalV1', profile != 'minimal')
              probe('HistoryFailureStageV1', profile != 'minimal')
              probe('HistoryFailureClassV1', profile != 'minimal')
              probe('financial_ci_snapshot', profile in ['observed-pixel', 'observed-semantic'])
              probe('financial_ci_clear_host_view', profile == 'observed-semantic')
              probe('financial_ci_flush_failure_before_owned_cleanup', profile == 'observed-semantic')
              if profile != 'minimal':
                  method = 'financial_ci_close_for_failed_admit_read_v1'
                  src = root/('admit-close-probe-'+profile+'.rs')
                  src.write_text('use wholepact_financial_coordinator_origin::SignerV3AdmitReadFinalV1;\nfn main() { let _ = SignerV3AdmitReadFinalV1::'+method+'; }\n')
                  command = rustup+['rustc', '--crate-name', 'admit_close_probe', '--edition=2021', '--emit=metadata', '--error-format=json', str(src), '--extern', 'wholepact_financial_coordinator_origin='+str(meta[0]), '-L', 'dependency='+str(target/'debug/deps'), '-o', str(root/'admit-close-probe.rmeta')]
                  p = subprocess.run(command, env=env, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=60)
                  if profile == 'observed-semantic': assert p.returncode == 0, p.stderr
                  else:
                      rows = [json.loads(line) for line in p.stderr.splitlines() if line.startswith('{')]
                      errors = [r for r in rows if r.get('level') == 'error' and r.get('code') is not None]
                      assert p.returncode != 0 and len(errors) == 1 and errors[0]['code']['code'] == 'E0599' and method in errors[0]['message'], (profile, p.stderr)
                      assert all(r.get('level') != 'error' or r in errors or r.get('message') == 'aborting due to 1 previous error' for r in rows)
              print(profile+': compiler and API fences passed')
          env = environments['production']
          args = rustup+['cargo', 'test', '--locked', '-p', package, '--lib', '--no-default-features', '--features', feature, '--no-run', '--message-format=json']
          rows = [json.loads(line) for line in run(args, env=env).splitlines() if line.startswith('{')]
          executables = [row['executable'] for row in rows if row.get('reason') == 'compiler-artifact' and row.get('target', {}).get('name') == 'wholepact_financial_coordinator_origin' and row.get('profile', {}).get('test') and row.get('executable')]
          assert len(executables) == 1
          exe = executables[0]
          prefix = 'financial_workflow_clock::tests::'
          names = [prefix+n for n in ['fixed_full_workflow_clocks_share_one_original_epoch', 'full_offsets_shorten_and_never_restart_at_receive', 'full_cleanup_is_capped_without_action_extension', 'original_cleanup_retention_never_renews_and_floor_only_crosses_edges']]
          packet_prefix = 'financial_workflow_channel::v3_delivery_packet_roundtrip_tests::'
          names += [packet_prefix+n for n in ['prepared_packet_roundtrip_and_denials', 'receive_display_packet_roundtrip_and_denials', 'received_packet_roundtrip_and_denials', 'admit_read_display_packet_roundtrip_and_denials']]
          names += ['signer_v3_pair_data::channel_clock_tests::'+n for n in ['channel_window_is_frozen_separately_from_action', 'action_cannot_outlive_original_channel']]
          names += ['financial_workflow_origin::v3_entry::pair::pair_channel_wall_tests::'+n for n in ['separate_channel_wall_horizon_does_not_change_action_horizon', 'channel_wall_reconstruction_does_not_restart_and_denies_rollback_expiry']]
          names += ['financial_workflow_origin::v3_entry::delivery::tests::'+n for n in ['delivery_custody_wall_preserves_long_originals_without_widening_actions', 'delivery_custody_reconstruction_keeps_shorter_channel_epoch_and_expiry']]
          names += ['completed_pair_origin::tests::'+n for n in ['completed_pair_received_service_preserves_original_long_horizon_and_review120', 'completed_pair_received_service_keeps_epoch_both_sources_and_supervision_without_pair900']]
          names += ['financial_workflow_channel::composition_tests::continue_valid_data_can_exceed_actual_packet_and_original_peer_join_remains_exact']
          names += ['signer_continue_state::shared_wall_tests::delayed_sample_reproduces_legacy_false_rollback_and_existing_helper_repairs_it']
          names += ['financial_workflow_origin::retirement::retirement_error_observation_tests::history_retirement_observation_preserves_operation_and_original_io_error']
          names += ['financial_workflow_origin::financial_selector::tests::'+n for n in ['actual_selector_preserves_closed_request_and_original_endpoint', 'selector_cannot_replace_result_source_or_socket', 'selector_cannot_replace_fixed_authorization_consent_or_account', 'selector_rejects_unknown_request_fields_and_relative_or_control_paths', 'distinct_financial_and_delivery_sources_join_without_relabelling', 'selector_binds_each_original_v3_observation_field_independently', 'selector_join_is_bound_to_actual_source_domains_and_retained_callers']]
          assert len(names) == 26 and len(set(names)) == 26
          for name in names:
              listing = run([exe, '--list', '--exact', name], env=env, timeout=30)
              assert [line for line in listing.splitlines() if line.endswith(': test')] == [name+': test'], name
              result = run([exe, '--exact', name, '--test-threads=1'], env=env, timeout=30)
              assert 'test result: ok. 1 passed; 0 failed; 0 ignored;' in result, name
              print(name+': passed')
          # These actual Origin writer/reporter tests are semantic-only: the
          # production executable above cannot establish their execution.
          env = environments['observed-semantic']
          rows = [json.loads(line) for line in run(args, env=env).splitlines() if line.startswith('{')]
          executables = [row['executable'] for row in rows if row.get('reason') == 'compiler-artifact' and row.get('target', {}).get('name') == 'wholepact_financial_coordinator_origin' and row.get('profile', {}).get('test') and row.get('executable')]
          assert len(executables) == 1
          exe = executables[0]
          semantic_names = [
              'financial_ci_failure_boundary::tests::early_append_panic_keeps_attempted_state_and_never_retries',
              'financial_ci_actor_diagnostics::tests::early_append_panic_keeps_first_worker_class_without_retry',
              'financial_observer::early_actor_observation_tests::pre_cleanup_flush_never_waits_for_owned_writer_lock',
              'financial_workflow_origin::retirement::retirement_error_observation_tests::history_retirement_observation_preserves_operation_and_original_io_error',
              'financial_ci_actor_diagnostics::tests::retirement_actual_error_enables_first_finite_detail_without_rewrite',
              'financial_ci_actor_diagnostics::tests::coordinator_reported_witness_detail_precedes_cascading_peer_exit',
              'financial_ci_host_diagnostics::tests::relay_top_level_failure_preserves_inner_observation_and_first_failure',
              'financial_ci_host_diagnostics::tests::copied_reporter_records_panicking_or_failed_append_before_second_flush',
              'financial_observer::early_actor_observation_tests::host_pre_drop_flush_never_waits_for_owned_writer_lock',
          ]
          assert len(semantic_names) == 9 and len(set(semantic_names)) == 9
          for name in semantic_names:
              listing = run([exe, '--list', '--exact', name], env=env, timeout=30)
              assert [line for line in listing.splitlines() if line.endswith(': test')] == [name+': test'], name
              result = run([exe, '--exact', name, '--test-threads=1'], env=env, timeout=30)
              assert 'test result: ok. 1 passed; 0 failed; 0 ignored;' in result, name
              print(name+': passed')
          print('Four clock, four actual packet round-trip, two actual Pair DTO, two Pair wall-helper tests, two delivery custody and two completed-Pair service clock tests, one actual Continue packet/peer composition test, one actual shared-wall publication-order regression, three actual semantic Origin reporter/writer-lock regressions, one actual retirement wrapper regression in production and semantic, one semantic retirement first-detail regression, three actual Host relay/reporter/pre-drop regressions, one reported-Witness first-detail regression, eight actual-source Host/wrapper regressions, and all retained source-extracted inert-carrier regressions passed. Compiler/API preflight only; not authority-flow, native/full qualification, deployment or settlement.')
          PY
  affected-contexts:
    needs: preflight
    if: success() && github.repository == 'stanleykosi/pactloom' && github.ref == 'refs/heads/checkpoint/terminal-phase-preflight-p80' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch exact public event source without credentials
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          umask 022
          public_git() {
            env -i PATH="$PATH" HOME="$RUNNER_TEMP/preflight-home" \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
              git -c credential.helper= -c http.extraheader= "$@"
          }
          public_git init source
          public_git -C source fetch --no-tags --depth=1 https://github.com/stanleykosi/pactloom.git "$SOURCE_COMMIT"
          public_git -C source checkout --detach FETCH_HEAD
          test "$(public_git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(public_git -C source status --porcelain --untracked-files=all)"
      - name: Affected semantic contexts and fixed maintained security tests (not fullflow)
        shell: bash
        working-directory: source
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/close-contexts/home" "$RUNNER_TEMP/close-contexts/cargo" "$RUNNER_TEMP/close-contexts/target-shared"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/close-contexts/home" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" rustup toolchain install 1.99.0 --profile minimal --no-self-update
          test "$(env -i PATH="$PATH" HOME="$RUNNER_TEMP/close-contexts/home" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" rustup run 1.99.0 rustc --version)" = 'rustc 1.99.0 (b940084d7 2026-09-28)'
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/close-contexts/home" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" PREFLIGHT_ROOT="$RUNNER_TEMP/close-contexts" SOURCE_COMMIT="$SOURCE_COMMIT" python3 -I -B scripts/ci-close-preflight-contexts.py
      - name: Remove exact job-owned preflight directories
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/close-contexts"
