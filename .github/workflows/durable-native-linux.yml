name: Origin integration then explicit B1 native lifecycle (Linux)
on:
  push:
    branches: [qualification/durable-proposal-v1]
permissions:
  contents: read
concurrency:
  group: qualification-durable-proposal-v1
  cancel-in-progress: false
jobs:
  synthetic-only:
    if: github.repository == 'stanleykosi/pactloom' && github.ref == 'refs/heads/qualification/durable-proposal-v1' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Fetch exact public event commit without credentials
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          umask 077
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git init source
          git -C source -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 https://github.com/stanleykosi/pactloom.git "$SOURCE_COMMIT"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
      - name: Read explicit qualification mode (origin is not full qualification)
        id: mode
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          mode="$(cat scripts/qualification-gate-mode)"
          [[ "$mode" == origin || "$mode" == full ]]
          [[ "$(wc -l < scripts/qualification-gate-mode)" -eq 1 ]]
          printf 'gate=%s\n' "$mode" >> "$GITHUB_OUTPUT"
      - name: Minimal real production origin integration (not full qualification)
        shell: bash
        working-directory: source
        run: bash scripts/ci-origin-integration-linux.sh
      - name: Narrow-only result (full native payment qualification not run)
        if: steps.mode.outputs.gate == 'origin'
        shell: bash
        run: |
          echo 'Origin integration passed. Full native/payment qualification was intentionally not run.' >> "$GITHUB_STEP_SUMMARY"
      - name: Closed B1 native lifecycle (not full financial payment qualification)
        if: steps.mode.outputs.gate == 'full'
        shell: bash
        working-directory: source
        env:
          CARGO_BUILD_JOBS: '3'
          CARGO_INCREMENTAL: '0'
          WHOLEPACT_BUILD_JOBS: '3'
        run: bash scripts/ci-durable-native-linux.sh
