name: Explicit isolated qualification gates (Linux)
on:
  push:
    branches: [qualification/durable-proposal-v1]
permissions:
  contents: read
  actions: read
concurrency:
  group: qualification-durable-proposal-v1
  cancel-in-progress: false
jobs:
  synthetic-only:
    if: github.repository == 'stanleykosi/pactloom' && github.ref == 'refs/heads/qualification/durable-proposal-v1' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - name: Fetch exact public event commit without credentials
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          umask 022 # Public source modes must match tracked Git modes.
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git init source
          git -C source -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 https://github.com/stanleykosi/pactloom.git "$SOURCE_COMMIT"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
      - name: Read explicit qualification mode (origin is not full qualification)
        id: mode
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          mode="$(cat scripts/qualification-gate-mode)"
          [[ "$mode" == origin || "$mode" == full || "$mode" == financial || "$mode" == bootstrap || "$mode" == ui || "$mode" == financial-ui || "$mode" == financial-semantic || "$mode" == financial-semantic-reuse || "$mode" == financial-preparation-diagnostic || "$mode" == financial-semantic-p81-reuse ]]
          [[ "$(wc -l < scripts/qualification-gate-mode)" -eq 1 ]]
          printf 'gate=%s\n' "$mode" >> "$GITHUB_OUTPUT"
      - name: Minimal real production origin integration (not full qualification)
        if: steps.mode.outputs.gate != 'bootstrap' && steps.mode.outputs.gate != 'ui' && steps.mode.outputs.gate != 'financial-ui' && steps.mode.outputs.gate != 'financial-semantic' && steps.mode.outputs.gate != 'financial-semantic-reuse' && steps.mode.outputs.gate != 'financial-preparation-diagnostic' && steps.mode.outputs.gate != 'financial-semantic-p81-reuse'
        shell: bash
        working-directory: source
        run: bash scripts/ci-origin-integration-linux.sh
      - name: Narrow-only result (full native payment qualification not run)
        if: steps.mode.outputs.gate == 'origin'
        shell: bash
        run: |
          echo 'Origin integration passed. Full native/payment qualification was intentionally not run.' >> "$GITHUB_STEP_SUMMARY"
      - name: Explicit synthetic native lifecycle (not public-chain settlement)
        if: steps.mode.outputs.gate == 'full' || steps.mode.outputs.gate == 'financial'
        shell: bash
        working-directory: source
        env:
          CARGO_BUILD_JOBS: '3'
          CARGO_INCREMENTAL: '0'
          WHOLEPACT_BUILD_JOBS: '3'
        run: bash scripts/ci-durable-native-linux.sh
      - name: Isolated bootstrap profile (UI uses seven reap/lifetime prerequisites)
        if: steps.mode.outputs.gate == 'bootstrap'
        timeout-minutes: 45
        shell: bash
        working-directory: source
        run: bash scripts/ci-bootstrap-linux.sh
      - name: Verify bootstrap containers and temporary image removed
        if: always() && steps.mode.outputs.gate == 'bootstrap'
        timeout-minutes: 5
        shell: bash
        working-directory: source
        run: python3 -I -B scripts/ci-bootstrap-supervisor.py cleanup
      - name: Bootstrap-only evidence boundary
        if: success() && steps.mode.outputs.gate == 'bootstrap'
        shell: bash
        run: |
          echo 'Bootstrap-only qualification passed. Origin and financial suites were intentionally not rerun. Historical CI64 financial evidence is unchanged, not revalidated. No financial authority, settlement, deployment or full-product acceptance is claimed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify exact historical CI70 bootstrap prerequisite (not a current run)
        if: steps.mode.outputs.gate == 'ui'
        timeout-minutes: 3
        shell: bash
        working-directory: source
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 https://github.com/stanleykosi/pactloom.git e2ad650efe7d9a5db94662e6713b7447fc4f6f81
          python3 -I -B scripts/ci-ui-prerequisite.py
      - name: Actual isolated UI smoke and one reused synthetic fixture
        id: ui
        if: steps.mode.outputs.gate == 'ui'
        timeout-minutes: 100
        shell: bash
        working-directory: source
        env:
          UI_ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: bash scripts/ci-ui-linux.sh
      - name: Preserve exact credential-free compiled UI bundle
        if: always() && steps.mode.outputs.gate == 'ui' && steps.ui.outputs.artifact_bundle_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/wholepact-ui-build-${{ github.run_id }}-${{ github.run_attempt }}/build.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
          overwrite: false
          include-hidden-files: false
      - name: Verify UI containers, temporary image and build cache removed
        if: always() && steps.mode.outputs.gate == 'ui'
        timeout-minutes: 5
        shell: bash
        working-directory: source
        run: python3 -I -B scripts/ci-ui-supervisor.py cleanup
      - name: Source-backed UI evidence boundary
        if: success() && steps.mode.outputs.gate == 'ui'
        shell: bash
        run: |
          echo 'Historical CI70 seven bootstrap reap/lifetime prerequisites were reused only after exact source/Cargo/script closure and original job checks. They were not rerun on this image. The new foundation and isolated actual UI gate passed. CI70 remains failed at image installation. The eight packet/credential fault results are historical individual CI69 evidence, not rerun or current-image qualification; CI69 remains failed. One unfunded synthetic fixture was reused for cancel, blur/refocus and at most one authenticated synthetic journal append. Historical CI64 financial evidence is unchanged, not revalidated. No public-chain settlement, deployment, funded wallet or full-product acceptance is claimed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Financial recipe and projection gates (no build or fixture)
        if: steps.mode.outputs.gate == 'financial-ui' || steps.mode.outputs.gate == 'financial-semantic'
        timeout-minutes: 200
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          python3 -I -B scripts/ci-financial-launch-tests.py
          python3 -I -B -m unittest discover -s scripts/tests -p 'test*financial*.py'
      - name: Fresh exact-source financial build (no runtime fixture)
        id: financial_build
        if: steps.mode.outputs.gate == 'financial-ui' || steps.mode.outputs.gate == 'financial-semantic'
        timeout-minutes: 200
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          python3 -I -B scripts/ci-financial-supervisor.py build
      - name: Preserve exact credential-free compiled financial bundle
        if: success() && (steps.mode.outputs.gate == 'financial-ui' || steps.mode.outputs.gate == 'financial-semantic') && steps.financial_build.outcome == 'success' && steps.financial_build.outputs.artifact_bundle_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: financial-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/wholepact-financial-build-${{ github.run_id }}-${{ github.run_attempt }}/build.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
          overwrite: false
          include-hidden-files: false
      - name: Financial image and native runtime (verified same-job fresh bundle)
        id: financial
        if: success() && (steps.mode.outputs.gate == 'financial-ui' || steps.mode.outputs.gate == 'financial-semantic') && steps.financial_build.outcome == 'success'
        timeout-minutes: 200
        shell: bash
        working-directory: source
        env:
          FINANCIAL_BUILD_READY: ${{ steps.financial_build.outputs.artifact_bundle_ready }}
          FINANCIAL_BUILD_SHA256: ${{ steps.financial_build.outputs.artifact_bundle_sha256 }}
          FINANCIAL_BUILD_SIZE: ${{ steps.financial_build.outputs.artifact_bundle_size }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          test "$FINANCIAL_BUILD_READY" = true
          python3 -I -B scripts/ci-financial-supervisor.py run-built
      - name: Verify financial containers, temporary images and build cache removed
        if: always() && (steps.mode.outputs.gate == 'financial-ui' || steps.mode.outputs.gate == 'financial-semantic')
        timeout-minutes: 5
        shell: bash
        working-directory: source
        run: python3 -I -B scripts/ci-financial-supervisor.py cleanup
      - name: Remove exact same-job credential-free financial bundle
        if: always() && (steps.mode.outputs.gate == 'financial-ui' || steps.mode.outputs.gate == 'financial-semantic')
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]
          directory="$RUNNER_TEMP/wholepact-financial-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -L "$directory"
          rm -rf -- "$directory"
      - name: Distinct financial profile evidence boundary
        if: success() && steps.financial.outcome == 'success' && steps.mode.outputs.gate == 'financial-ui'
        shell: bash
        run: |
          echo 'Fresh exact-source synthetic two-signer financial UI passed the external-pre-V3-native-Witness profile, including seven integrated financial Witness services, six retained-inert Witness roots and actual owned reaps. Early history, admission and audit used the actual external native Witness operator, not thirteen integrated service purposes. Both signing retirements, CompletedPair, separate Returns, normal close and container/image/cache cleanup were verified. No dispatch, public-chain settlement, deployment or full-product acceptance is claimed. Existing narrow CI evidence was not rerun or upgraded.' >> "$GITHUB_STEP_SUMMARY"
      - name: Distinct semantic-assisted financial evidence boundary
        if: success() && steps.financial.outcome == 'success' && steps.mode.outputs.gate == 'financial-semantic'
        shell: bash
        run: |
          echo 'Fresh coordinated-financial-rendered-host-semantic-v1 synthetic two-signer qualification passed using read-only same-rendered-Host-text observation. All native authority, full proof, retirements, Returns, normal close and cleanup checks remain required. This is NOT pixel-only UI qualification; the original financial-ui gate remains separately callable and is not upgraded. No dispatch, public-chain settlement, deployment or full-product acceptance is claimed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch fixed P81 native producer and exact reviewed H83 harness without credentials
        if: steps.mode.outputs.gate == 'financial-semantic-p81-reuse'
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          umask 022
          fetch_fixed() {
            local destination="$1" commit="$2"
            mkdir "$destination"
            git -C "$destination" init --quiet
            git -C "$destination" -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 https://github.com/stanleykosi/pactloom.git "$commit"
            git -C "$destination" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$destination" rev-parse HEAD)" = "$commit"
            test -z "$(git -C "$destination" status --porcelain --untracked-files=all)"
          }
          fetch_fixed P81 1fa2cec1dffd8672a107327de3046110d9fb4065
          fetch_fixed H83 8d9c7c9674f1d35d251f3c6f324917d40f176ce8
      - name: Fixed P81 reuse identity archive and cleanup boundary tests (no native execution)
        if: steps.mode.outputs.gate == 'financial-semantic-p81-reuse'
        timeout-minutes: 5
        shell: bash
        run: env -i PATH="$PATH" HOME=/nonexistent GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 python3 -I -B -m unittest discover -s source/scripts/tests -p 'test_ci_financial_p81_reuse.py'
      - name: Acquire only fixed P81 build using existing isolated read token
        if: steps.mode.outputs.gate == 'financial-semantic-p81-reuse'
        timeout-minutes: 6
        shell: bash
        env:
          FINANCIAL_ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -B "$GITHUB_WORKSPACE/source/scripts/ci-financial-p81-reuse.py" acquire "$GITHUB_WORKSPACE/source"
      - name: Verify fixed P81 archive H83 closure and independent cleanup (no native execution)
        if: steps.mode.outputs.gate == 'financial-semantic-p81-reuse'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF="$GITHUB_REF" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_JOB="$GITHUB_JOB" \
            python3 -I -B "$GITHUB_WORKSPACE/source/scripts/ci-financial-p81-reuse.py" verify \
            "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/P81" "$GITHUB_WORKSPACE/H83"
      - name: Fresh H83 tests image and synthetic runtime using verified P81 native binaries
        id: p81_reuse_runtime
        if: steps.mode.outputs.gate == 'financial-semantic-p81-reuse'
        timeout-minutes: 200
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF="$GITHUB_REF" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_JOB="$GITHUB_JOB" \
            python3 -I -B "$GITHUB_WORKSPACE/source/scripts/ci-financial-p81-reuse.py" run \
            "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/P81" "$GITHUB_WORKSPACE/H83"
      - name: Always reconcile fixed P81 reuse resources using independently pinned cleanup
        if: always() && steps.mode.outputs.gate == 'financial-semantic-p81-reuse'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF="$GITHUB_REF" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_JOB="$GITHUB_JOB" \
            python3 -I -B "$GITHUB_WORKSPACE/source/scripts/ci-financial-p81-reuse.py" cleanup "$GITHUB_WORKSPACE/source"
      - name: Remove exact fixed P81 acquisition directory (no runtime output upload)
        if: always() && steps.mode.outputs.gate == 'financial-semantic-p81-reuse'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]
          directory="$RUNNER_TEMP/wholepact-financial-p81-download-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -L "$directory"
          rm -rf -- "$directory"
      - name: Fixed P81 reuse evidence boundary after runtime and all cleanup
        if: success() && steps.mode.outputs.gate == 'financial-semantic-p81-reuse' && steps.p81_reuse_runtime.outcome == 'success'
        shell: bash
        run: |
          echo 'Fresh exact H83 Python tests and semantic-assisted synthetic external-Witness runtime passed using verified P81 native binaries. Native producer is P81 1fa2cec1dffd8672a107327de3046110d9fb4065, runtime harness is H83 8d9c7c9674f1d35d251f3c6f324917d40f176ce8, and this event is the independent launcher. Exact P81 native ELF bytes were reused, not freshly compiled by this runtime step. Separate H83 preflight compiler/native gates and real TLS checks remain required. Both owned runtime cleanup and independent cleanup passed; the acquisition directory was removed. No pixel-only UI, full-product, public-chain, deployment or dispatch claim is made.' >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch exact independent producer P and reviewed harness H without credentials
        if: steps.mode.outputs.gate == 'financial-semantic-reuse' || steps.mode.outputs.gate == 'financial-preparation-diagnostic'
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          umask 022
          fetch_exact() {
            local destination="$1" commit="$2"
            mkdir "$destination"
            git -C "$destination" init --quiet
            git -C "$destination" -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 https://github.com/stanleykosi/pactloom.git "$commit"
            git -C "$destination" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$destination" rev-parse HEAD)" = "$commit"
            test -z "$(git -C "$destination" status --porcelain --untracked-files=all)"
          }
          fetch_exact P 99501f5853a4516fc94a6361f39cb4373048f01f
          fetch_exact H 3fc27434f7ee5d2af5f71c9d9010b982bedf74dd
      - name: Run launcher negative and protocol tests without credentials
        if: steps.mode.outputs.gate == 'financial-semantic-reuse' || steps.mode.outputs.gate == 'financial-preparation-diagnostic'
        timeout-minutes: 5
        shell: bash
        run: python3 -I -B -m unittest discover -s source/scripts/financial-runtime-reuse -p 'test_*.py'
      - name: Acquire exact producer bundle with isolated read token
        if: steps.mode.outputs.gate == 'financial-semantic-reuse' || steps.mode.outputs.gate == 'financial-preparation-diagnostic'
        timeout-minutes: 6
        shell: bash
        env:
          FINANCIAL_ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -B "$GITHUB_WORKSPACE/source/scripts/financial-runtime-reuse/launch_adapter.py" acquire \
            "$GITHUB_WORKSPACE/source/scripts/financial-runtime-reuse/plan.json" \
            "$RUNNER_TEMP/wholepact-financial-reuse-download-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "${GITHUB_WORKSPACE}/source"
      - name: Pre-runtime trusted cleanup smoke after exact archive acquisition (no native execution)
        if: steps.mode.outputs.gate == 'financial-semantic-reuse'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF="$GITHUB_REF" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_JOB="$GITHUB_JOB" \
            python3 -I -B "${GITHUB_WORKSPACE}/source/scripts/financial-runtime-reuse/launch_adapter.py" cleanup "${GITHUB_WORKSPACE}/source"
      - name: Actual synthetic financial runtime using verified producer binaries (not a fresh build)
        if: steps.mode.outputs.gate == 'financial-semantic-reuse'
        timeout-minutes: 200
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF="$GITHUB_REF" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_JOB="$GITHUB_JOB" \
            python3 -I -B "$GITHUB_WORKSPACE/source/scripts/financial-runtime-reuse/launch_adapter.py" run \
            "$GITHUB_WORKSPACE/source/scripts/financial-runtime-reuse/plan.json" "$GITHUB_WORKSPACE/P" "$GITHUB_WORKSPACE/H" \
            "$RUNNER_TEMP/wholepact-financial-reuse-download-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "${GITHUB_WORKSPACE}/source"
      - name: Always reconcile exact job-owned resources from trusted L only
        if: always() && steps.mode.outputs.gate == 'financial-semantic-reuse'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF="$GITHUB_REF" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_JOB="$GITHUB_JOB" \
            python3 -I -B "$GITHUB_WORKSPACE/source/scripts/financial-runtime-reuse/launch_adapter.py" cleanup "${GITHUB_WORKSPACE}/source"
      - name: Remove exact job acquisition directory (no fixture output upload)
        if: always() && steps.mode.outputs.gate == 'financial-semantic-reuse'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]
          directory="$RUNNER_TEMP/wholepact-financial-reuse-download-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -L "$directory"
          rm -rf -- "$directory"

      - name: Preparation diagnostic trusted cleanup smoke (no native execution)
        if: steps.mode.outputs.gate == 'financial-preparation-diagnostic'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF="$GITHUB_REF" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_JOB="$GITHUB_JOB" \
            python3 -I -B "${GITHUB_WORKSPACE}/source/scripts/financial-runtime-reuse/diagnostic_adapter.py" cleanup "${GITHUB_WORKSPACE}/source"
      - name: Preserved P35 preparation, owned admissions and process-death reopen diagnostic (NOT full flow)
        if: steps.mode.outputs.gate == 'financial-preparation-diagnostic'
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF="$GITHUB_REF" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_JOB="$GITHUB_JOB" \
            python3 -I -B "$GITHUB_WORKSPACE/source/scripts/financial-runtime-reuse/diagnostic_adapter.py" run \
            "$GITHUB_WORKSPACE/source/scripts/financial-runtime-reuse/plan.json" "$GITHUB_WORKSPACE/P" "$GITHUB_WORKSPACE/H" \
            "$RUNNER_TEMP/wholepact-financial-reuse-download-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "${GITHUB_WORKSPACE}/source"
      - name: Always reconcile diagnostic job-owned resources from trusted P35 cleanup
        if: always() && steps.mode.outputs.gate == 'financial-preparation-diagnostic'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF="$GITHUB_REF" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_JOB="$GITHUB_JOB" \
            python3 -I -B "$GITHUB_WORKSPACE/source/scripts/financial-runtime-reuse/diagnostic_adapter.py" cleanup "${GITHUB_WORKSPACE}/source"
      - name: Remove diagnostic acquisition directory (no raw output upload)
        if: always() && steps.mode.outputs.gate == 'financial-preparation-diagnostic'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]
          directory="$RUNNER_TEMP/wholepact-financial-reuse-download-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -L "$directory"
          rm -rf -- "$directory"
