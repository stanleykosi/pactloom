[workspace]
resolver = "2"
members = [
  "crates/wholepact-core",
  "crates/wholepact-protocol",
  "crates/wholepact-store",
  "crates/wholepact-engine",
  "crates/wholepact-service",
  "crates/wholepact-cli",
  "crates/wholepact-signer",
  "crates/wholepact-signer-origin",
  "crates/wholepact-transport",
  "crates/wholepact-signer-release",
  "crates/wholepact-chain",
  "crates/wholepact-wallet",
  "crates/wholepact-storage-security",
  "crates/wholepact-proof-jobs",
  "crates/wholepact-signer-ui",
  "crates/wholepact-native-host",
  "crates/wholepact-authority",
  "crates/wholepact-offline-bridge",
  "crates/wholepact-financial-review-model",
  "crates/wholepact-financial-coordinator",
  "crates/wholepact-financial-coordinator-origin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "=0.37.0", features = ["sqlcipher", "backup"] }

